spring.application.name=new-demo


# Server Port
server.port=8080

# Database Connection
spring.datasource.url=jdbc:sqlite:/Users/imac/.secure_db/employee_db.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Use the official Hibernate community dialect for SQLite (handles LIMIT/OFFSET correctly)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable open-in-view to avoid unnecessary DB connections during view rendering
spring.jpa.open-in-view=false